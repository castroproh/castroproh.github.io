      <section>
        <h2>Unas cosas que quería decirte</h2>
        <div class="card letter">
          <p class="letter-open">Owen, hola:</p>
          <p>
            Quería dejarte algo escrito que se pareciera más a nosotros que a
            una carta solemne. Porque todo empezó con un «jai» y un «¿quieres
            pasarla guay?», y de pronto ya estábamos hablando de música,
            dibujos, comida, cosas que nos preocupan, cosas que nos dan risa y
            temas que aparecen sin pedir permiso. Todavía me da ternura pensar
            que una conversación tan sencilla terminara convirtiéndose en tantas
            cosas compartidas.
          </p>
          <p>
            Me gusta cómo podemos pasar de hablar en serio a terminar riéndonos
            porque alguien leyó «papiloma» donde no era. Me acuerdo de las
            proyectadas, de los «vavavavava», del «yo te ayufo cn la segunda
            voz», de los planes de grabar algo y de todas esas pequeñas
            conversaciones que quizá, vistas desde fuera, parecen normales. Para
            mí tienen algo especial porque son nuestras, y porque me gusta que
            me las sigas contando.
          </p>
          <p>
            A veces no sé explicar lo que siento sin esconderlo detrás de una
            broma o de un «gracia amor», así que voy a intentar decirlo bien por
            una vez: te quiero muchísimo. Te amo, de verdad. No lo escribo para
            hacer de esto un gran discurso ni para ponerle nombre a cada cosa;
            lo escribo porque es verdad y porque me gusta que también queden
            guardadas las cosas bonitas, no solo los mensajes y las
            estadísticas.
          </p>
          <p>
            Hay algo muy bonito en tener a alguien con quien compartir tanto sin
            tener que preparar cada conversación. Me gusta cuando me enseñas
            algo que te emociona, cuando me cuentas una historia, cuando me
            mandas una foto o cuando una pregunta cualquiera acaba abriendo
            otros veinte temas. También me gusta esa confianza que se va
            formando poco a poco, con palabras que repetimos, chistes que ya
            entendemos y detalles pequeños que terminan importando más de lo que
            uno esperaba.
          </p>
          <p>
            No hace falta que cada día pase algo extraordinario para que me
            alegre saber de ti. Un «ola», un sticker, un «mira» o cualquier cosa
            que te haya dado risa también puede hacerme el día un poquito mejor.
            Y si alguna vez no sabes qué decir, tampoco pasa nada. No tienes que
            encontrar siempre la historia perfecta; me gusta saber de ti tal
            como vienes, con tus cosas buenas, tus dudas, tus ideas y tus días
            normales.
          </p>
          <p>
            Quiero que te salgan los planes que llevas en la cabeza, que sigas
            encontrando música, series y cosas que te hagan ilusión, y que no te
            hables tan duro cuando algo no salga como querías. Tienes muchas
            cosas bonitas en ti, incluso en esos días en los que sientes que no
            estás haciendo demasiado. Ojalá no se te olvide; y si se te olvida,
            aquí habrá alguien que te lo recuerde, aunque probablemente termine
            metiendo una tontería en medio para que no parezca un sermón.
          </p>
          <p>
            Y sigue pendiente lo de grabar música. Tú ofreciste la segunda voz y
            yo no pienso dejar que esa propuesta se pierda en el historial.
            Algún día habrá que sentarnos, hacer algo nuestro y ver qué sale. Si
            no llegamos a ninguna parte, al menos tendremos otra historia que
            recordar; si sale bien, ya podremos presumir como si lo hubiéramos
            planeado desde el principio.
          </p>
          <p>
            Me alegra haberte encontrado y poder compartir contigo todo esto,
            incluso cuando no sé muy bien cómo explicarlo. Me importas mucho,
            disfruto tenerte cerca de mi vida y me nace tratarte con cariño. No
            creo que haga falta decirlo de una forma perfecta para que sea
            cierto; aun así, quería dejarlo escrito aquí, entre tanto «sisisi»,
            un montón de mensajes y nuestras curiosas formas de decirnos las
            cosas.
          </p>
          <p>
            Así que eso: te amo, Owen. Gracias por las conversaciones, las
            risas, las cosas que me cuentas y por ser tú. Y, por supuesto,
            gracia amor por todo lo demás. 🍪👀💙❤️
          </p>
          <p class="sig hand">— Mateo (que todavía espera esa segunda voz)</p>
        </div>
