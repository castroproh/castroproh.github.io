    </main>
    <script>
      const $ = (id) => document.getElementById(id),
        N = (n) => n.toLocaleString("es-MX"),
        NS = "http://www.w3.org/2000/svg";
      const fl = $("fl");
      function sprinkle(x) {
        const s = document.createElement("span");
        s.textContent = ["🍪", "👀", "💙", "❤️", "✦", "♡"][
          (Math.random() * 7) | 0
        ];
        s.style.left = (x ?? Math.random() * 100) + "%";
        s.style.fontSize = 14 + Math.random() * 16 + "px";
        const t = 6 + Math.random() * 5;
        s.style.animationDuration = t + "s";
        fl.appendChild(s);
        setTimeout(() => s.remove(), t * 1000);
      }
      setInterval(() => sprinkle(), 2600);
      try {
        $("dn").textContent = Math.max(
          1,
          Math.floor((Date.now() - new Date(2026, 6, 1)) / 864e5) + 1
        );
      } catch (e) {}
      const stats = [
        [18884, "mensajes entre los dos"],
        [108, "días con mensajes, de 115"],
        [71, "días seguidos hablando"],
        [1136, "mensajes en un solo día: 7 de julio"],
        [510, "mensajes con risa 🤣"],
        [348, "veces que escribimos “amor”"],
        [34, "veces que dijimos “gracia amor”"],
        [1091, "mensajes después de medianoche 🌙"],
        [2105, "fotos, stickers, audios y videos"],
        [55, "veces que hablamos del cabello 💇"],
      ];
      const sg = $("stats");
      stats.forEach(([n, l]) => {
        const d = document.createElement("div");
        d.className = "card st";
        d.innerHTML = '<b data-n="' + n + '">0</b><small>' + l + "</small>";
        sg.appendChild(d);
      });
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (!e.isIntersecting) return;
            io.unobserve(e.target);
            const el = e.target,
              n = +el.dataset.n,
              t0 = performance.now();
            (function f(t) {
              const p = Math.min(1, (t - t0) / 1400);
              el.textContent = N(Math.round(n * (1 - Math.pow(1 - p, 3))));
              if (p < 1) requestAnimationFrame(f);
            })(t0);
          }),
        { threshold: 0.6 }
      );
      sg.querySelectorAll("b").forEach((b) => io.observe(b));
      $("mon").innerHTML =
        [
          ["Julio", 9705],
          ["Agosto", 6048],
          ["Septiembre", 1981],
          ["Octubre*", 1150],
        ]
          .map(([m, n]) => "<div><b>" + N(n) + "</b>" + m + "</div>")
          .join("") +
        '<div style="grid-column:1/-1;font-size:.72rem">*hasta el 23 de octubre</div>';
      // Gráficas apiladas: azul = Owen (abajo), naranja = Mateo (arriba).
      function el(t, a, p) {
        const e = document.createElementNS(NS, t);
        for (const k in a) e.setAttribute(k, a[k]);
        p.appendChild(e);
        return e;
      }
      function stack(svg, o, m, { H, pad, labels, onsel }) {
        const w = 460,
          n = o.length,
          bw = (w - pad * 2) / n,
          mx = Math.max(...o.map((v, i) => v + m[i])),
          g = [];
        let sel;
        o.forEach((v, i) => {
          const ho = (v / mx) * (H - 18),
            hm = (m[i] / mx) * (H - 18),
            x = pad + i * bw + bw * 0.12,
            W = bw * 0.76;
          const a = el(
              "rect",
              {
                class: "sb",
                x,
                y: H - 14 - ho,
                width: W,
                height: Math.max(ho, 0.01),
              },
              svg
            ),
            b = el(
              "rect",
              {
                class: "sr",
                x,
                y: H - 14 - ho - hm,
                width: W,
                height: Math.max(hm, 0.01),
              },
              svg
            );
          const f = () => {
            sel && sel.forEach((r) => r.classList.remove("sel"));
            sel = [a, b];
            a.classList.add("sel");
            b.classList.add("sel");
            onsel && onsel(i, v, m[i]);
          };
          a.onclick = b.onclick = f;
        });
        labels.forEach(([i, t]) => {
          const x = el("text", { class: "ax", x: pad + i * bw, y: H - 3 }, svg);
          x.textContent = t;
        });
      }
      const D = [
          193, 240, 12, 170, 210, 258, 625, 538, 267, 117, 264, 302, 103, 82,
          180, 33, 231, 43, 65, 45, 17, 170, 132, 84, 111, 87, 175, 300, 208,
          13, 62, 38, 8, 58, 12, 456, 271, 63, 129, 252, 42, 134, 272, 50, 196,
          141, 220, 56, 113, 70, 110, 100, 88, 61, 4, 10, 111, 77, 75, 11, 99,
          46, 76, 38, 67, 23, 65, 213, 19, 61, 31, 0, 1, 24, 53, 30, 52, 19, 8,
          26, 102, 65, 35, 4, 19, 0, 0, 2, 0, 0, 0, 14, 90, 49, 5, 0, 0, 39, 0,
          0, 5, 43, 55, 14, 8, 18, 24, 4, 22, 19, 40, 55, 8, 59, 34, 138, 163,
          12, 143, 189, 198, 511, 356, 173, 94, 252, 298, 97, 33, 48, 28, 174,
          44, 97, 18, 20, 159, 140, 87, 86, 79, 172, 234, 192, 26, 107, 44, 15,
          67, 24, 223, 180, 73, 72, 98, 33, 124, 158, 47, 160, 139, 173, 63, 71,
          93, 80, 92, 73, 67, 3, 8, 140, 111, 64, 17, 103, 60, 79, 45, 46, 19,
          64, 130, 13, 53, 29, 0, 3, 41, 73, 19, 46, 19, 14, 37, 54, 68, 23, 7,
          28, 0, 0, 1, 0, 0, 2, 21, 75, 42, 9, 0, 2, 18, 2, 0, 10, 34, 37, 22,
          13, 20, 41, 3, 26, 13, 29, 64, 11, 37, 51,
        ],
        Hh = [
          411, 150, 36, 0, 0, 44, 57, 45, 268, 539, 547, 368, 594, 587, 540,
          790, 560, 640, 589, 975, 699, 801, 639, 469, 382, 109, 3, 0, 1, 2, 37,
          60, 199, 408, 427, 399, 464, 530, 435, 618, 502, 501, 456, 754, 511,
          624, 578, 536,
        ],
        W = [
          925, 1588, 2345, 1441, 1082, 1258, 1709, 819, 1307, 1682, 1161, 1028,
          1099, 1440,
        ];
      const MN = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre",
      ];
      function fecha(i) {
        const d = new Date(2026, 6, 1 + i);
        return d.getDate() + " de " + MN[d.getMonth()];
      }
      function splitSeries(a) {
        const mid = a.length / 2;
        return [a.slice(0, mid), a.slice(mid)];
      }
      const [dailyO, dailyM] = splitSeries(D),
        [hourO, hourM] = splitSeries(Hh),
        [weekO, weekM] = splitSeries(W);
      stack($("daily"), dailyO, dailyM, {
        H: 150,
        pad: 6,
        labels: [
          [0, "1 jul"],
          [31, "1 ago"],
          [62, "1 sep"],
          [92, "1 oct"],
        ],
        onsel: (i, o, m) => {
          $("tip").innerHTML =
            fecha(i) +
            ' · <span class="bl">Owen ' +
            N(o) +
            '</span> · <span class="rd">Mateo ' +
            N(m) +
            "</span>";
        },
      });
      stack($("hrs"), hourO, hourM, {
        H: 120,
        pad: 6,
        labels: [
          [0, "12 a. m."],
          [6, "6 a. m."],
          [12, "12 p. m."],
          [18, "6 p. m."],
          [23, "11"],
        ],
      });
      stack($("wk"), weekO, weekM, {
        H: 100,
        pad: 20,
        labels: [
          [0, "lun"],
          [1, "mar"],
          [2, "mié"],
          [3, "jue"],
          [4, "vie"],
          [5, "sáb"],
          [6, "dom"],
        ],
      });
      // comparativa
      const cmp = [
        ["Mensajes", 10348, 8536],
        ["Audios 🎙️", 471, 212],
        ["Stickers", 438, 236],
        ["Fotos 📸", 216, 428],
        ["Videos", 35, 64],
        ["😭 (mensajes con)", 336, 26],
        ["🥺 (mensajes con)", 98, 15],
        ["🥹 (mensajes con)", 90, 3],
        ["Mensajes con “jaja”", 239, 171],
        ["Mensajes después de medianoche", 597, 494],
      ];
      $("cmp").innerHTML = cmp
        .map(
          ([l, a, b]) =>
            '<div class="row"><div class="t"><span>' +
            l +
            "</span><span>" +
            N(a) +
            " · " +
            N(b) +
            '</span></div><div class="sp"><div style="background:var(--bl)" data-w="' +
            (a / (a + b)) * 100 +
            '"></div><div style="background:var(--rd)" data-w="' +
            (b / (a + b)) * 100 +
            '"></div></div></div>'
        )
        .join("");
      const io3 = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target
                .querySelectorAll("[data-w]")
                .forEach((x) => (x.style.width = x.dataset.w + "%"));
              io3.unobserve(e.target);
            }
          }),
        { threshold: 0.2 }
      );
      io3.observe($("cmp"));
      // idioma
      $("idi").innerHTML = [
        ["ola", "157 veces mandamos solo esa palabra, sin la h", ""],
        ["gracia amor", "34 veces; una frase que ya tiene su propio lugar", ""],
        ["bro respeta", "24 veces, casi siempre de Owen", "b"],
        ["sisisi", "104 mensajes con “sisi”, casi todos de Owen", "b"],
        [
          "kepasuamor",
          "Owen, el 23 de octubre; una forma muy suya de saludar",
          "b",
        ],
        ["yoiwalamor", "versión Owen del “amor”, 16 de octubre", "b"],
        ["papiloma", "una lectura equivocada que todavía da risa", "r"],
        ["mantecado", "así le dije buenas noches el 3 de octubre", "r"],
      ]
        .map(
          ([a, b, c]) =>
            '<div class="card ' +
            c +
            '"><q>' +
            a +
            "</q><small>" +
            b +
            "</small></div>"
        )
        .join("");
      // línea del tiempo
      const msgs = [
        ["1 de julio", "ow", "jai"],
        ["1 de julio", "me", "quieres pasarla guay?"],
        ["1 de julio", "me", "que jueguen con mis sentimientos"],
        ["1 de julio", "ow", "me proyecté 🥀🥀🥀"],
        [
          "1 de julio",
          "me",
          "Ahorita soy vato desempleado músico indie soltero",
        ],
        ["1 de julio", "ow", "yo te ayufo cn la segunda voz"],
        ["1 de julio", "me", "Caele un día a mi casa… nos ponemos a grabar"],
        ["1 de julio", "me", "Hay que cruzarlos. Unión jochis."],
        ["1 de julio", "ow", "LEI PAPILOMA"],
        ["23 de octubre", "ow", "kepasuamor"],
        ["23 de octubre", "me", "te tengo un regalo 🍪👀"],
      ];
      const tl = $("tl");
      let last = "";
      msgs.forEach(([d, w, t]) => {
        if (d !== last) {
          const x = document.createElement("div");
          x.className = "d";
          x.innerHTML = "<b>" + d + "</b>";
          tl.appendChild(x);
          last = d;
        }
        const b = document.createElement("div");
        b.className = "b " + w;
        b.innerHTML =
          "<i>" + (w === "me" ? "Mateo 🧃" : "Owen 🦝") + "</i>" + t;
        tl.appendChild(b);
      });
      const io2 = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io2.unobserve(e.target);
            }
          }),
        { threshold: 0.3 }
      );
      tl.querySelectorAll(".b").forEach((b) => io2.observe(b));
      // quiz
      const Q = [
        ["quieres pasarla guay?", "m"],
        ["me proyecté", "o"],
        ["Ahorita soy vato desempleado músico indie soltero", "m"],
        ["yo te ayufo cn la segunda voz", "o"],
        ["Hay que cruzarlos. Unión jochis.", "m"],
        ["LEI PAPILOMA", "o"],
        ["kepasuamor", "o"],
        ["te tengo un regalo 🍪👀", "m"],
      ];
      let qi = 0,
        sc = 0,
        lock = false;
      function showQ() {
        if (qi >= Q.length) {
          $("qn").textContent = "Resultado";
          $("qq").textContent =
            sc +
            " de " +
            Q.length +
            (sc === Q.length
              ? " ¡nos conocemos de memoria!"
              : sc >= 5
              ? " bien, te acuerdas de nuestras cosas"
              : " toca volver a leer el chat 🍪");
          $("qb").style.display = $("qr").style.display = "none";
          $("fb").textContent = "";
          for (let i = 0; i < 14; i++) setTimeout(sprinkle, i * 80);
          return;
        }
        $("qn").textContent = "Pregunta " + (qi + 1) + " de " + Q.length;
        $("qq").textContent = "“" + Q[qi][0] + "”";
        $("fb").textContent = "";
        lock = false;
      }
      function ans(w) {
        if (lock || qi >= Q.length) return;
        lock = true;
        const ok = Q[qi][1] === w;
        if (ok) sc++;
        $("fb").innerHTML =
          (ok ? "✅ ¡Sí!" : "❌ Nop.") +
          " Lo escribió " +
          (Q[qi][1] === "o"
            ? '<b class="bl">Owen</b>'
            : '<b class="rd">Mateo</b>');
        qi++;
        setTimeout(showQ, 1300);
      }
      $("qb").onclick = () => ans("o");
      $("qr").onclick = () => ans("m");
      showQ();
      $("chips").innerHTML = [
        "Hora de aventura",
        "Nana",
        "TGSWIIWAAA",
        "Daria",
        "Downtown",
        "Arcane",
        "Rojuu",
        "Over the Garden Wall",
        "Life is Strange 1 y 2",
        "Los Sims",
        "tintes de pelo",
        "maquillaje",
        "ropa de segunda",
        "gatos",
        "café ☕",
        "música urbana",
        "Alanis Yuki",
        "Ataquemos",
        "Asia Menor",
        "Lázaro / Dopamina",
        "Inseye!",
        "🍪",
        "👀",
      ]
        .map((t) => "<span>" + t + "</span>")
        .join("");
      let g = 0;
      $("gb").onclick = () => {
        $("gn").textContent = ++g;
        sprinkle(30 + Math.random() * 40);
      };
      $("btn").onclick = function () {
        $("rev").classList.add("on");
        this.style.display = "none";
        for (let i = 0; i < 30; i++) setTimeout(() => sprinkle(), i * 90);
      };
    </script>
