<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <title>Owen &amp; Mateo · 🍪👀</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Nunito:wght@400;500;600;700;800&amp;family=Caveat:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fffaf7;
        --tx: #39292d;
        --mu: #806e72;
        --bl: #27aee3;
        --rd: #8a0000;
        --bl-soft: #e8f7fd;
        --rd-soft: #f8e9e9;
        --cream: #fff3e6;
        --card: rgba(255, 255, 255, 0.91);
        --bd: #efdfe0;
        --pink: #f9eef0;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #171316;
          --tx: #fff4f1;
          --mu: #c7b5b8;
          --card: rgba(39, 30, 34, 0.94);
          --bd: #49353b;
          --bl-soft: #163d4b;
          --rd-soft: #482426;
          --cream: #3e3028;
          color-scheme: dark;
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #171316;
        --tx: #fff4f1;
        --mu: #c7b5b8;
        --card: rgba(39, 30, 34, 0.94);
        --bd: #49353b;
        --bl-soft: #163d4b;
        --rd-soft: #482426;
        --cream: #3e3028;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        scroll-behavior: smooth;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--tx);
        font-family: "Nunito", Arial, sans-serif;
        line-height: 1.72;
        overflow-x: hidden;
        background: var(--bg);
        background-image: radial-gradient(
            55% 30% at 0% 0%,
            color-mix(in srgb, var(--bl) 13%, transparent),
            transparent
          ),
          radial-gradient(
            52% 35% at 100% 85%,
            color-mix(in srgb, var(--rd) 8%, transparent),
            transparent
          );
        background-attachment: fixed;
      }
      #fl {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 5;
      }
      #fl span {
        position: absolute;
        bottom: -42px;
        opacity: 0;
        animation: up linear forwards;
        filter: drop-shadow(0 2px 3px #00000010);
      }
      @keyframes up {
        10% {
          opacity: 0.78;
        }
        100% {
          transform: translateY(-110vh) rotate(18deg);
          opacity: 0;
        }
      }
      main {
        position: relative;
        z-index: 1;
        max-width: 760px;
        margin: 0 auto;
        padding: 0 22px 78px;
      }
      section {
        padding: 42px 0 3px;
        scroll-margin-top: 18px;
      }
      h1,
      h2 {
        font-weight: 700;
        line-height: 1.17;
        margin: 0 0 14px;
      }
      h2 {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: clamp(1.6rem, 5vw, 2rem);
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -0.015em;
      }
      h2::before {
        content: "✿";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 31px;
        width: 31px;
        height: 31px;
        border-radius: 50%;
        font-family: "Nunito", sans-serif;
        font-size: 0.9rem;
        color: var(--rd);
        background: var(--rd-soft);
      }
      p {
        margin: 0 0 13px;
      }
      .mu {
        color: var(--mu);
        font-size: 0.94rem;
      }
      .hand {
        font-family: "Caveat", cursive;
        font-weight: 700;
        letter-spacing: 0.005em;
      }
      .bl {
        color: var(--bl);
      }
      .rd {
        color: var(--rd);
      }
      .hero {
        min-height: 91vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        align-items: center;
        padding-top: 40px;
      }
      .hero-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        font-size: 3.2rem;
        margin-bottom: 16px;
        animation: bob 3.3s ease-in-out infinite;
        filter: drop-shadow(0 7px 12px #8a000011);
      }
      .hero-mark span {
        font-size: 1.8rem;
        transform: rotate(-8deg);
      }
      .hero-mark span:last-child {
        transform: rotate(8deg) translateY(6px);
      }
      .hero h1 {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: clamp(2.7rem, 10vw, 4.15rem);
        letter-spacing: -0.035em;
        margin: 0 0 8px;
      }
      .hero h1 .bl {
        font-style: normal;
      }
      .hero h1 .rd {
        font-style: normal;
      }
      .hero p {
        max-width: 440px;
        font-size: 1.04rem;
        margin-bottom: 6px;
      }
      @keyframes bob {
        50% {
          transform: translateY(-7px);
        }
      }
      .day {
        display: inline-block;
        margin: 16px auto 0;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 999px;
        padding: 7px 17px;
        font-size: 0.9rem;
        box-shadow: 0 6px 22px #8a00000b;
      }
      .day b {
        color: var(--bl);
        font-size: 1.1rem;
      }
      .hint {
        margin-top: 31px;
        color: var(--mu);
        font-size: 0.9rem;
        animation: bob 2.8s infinite;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 22px;
        padding: 19px;
        box-shadow: 0 12px 32px #5a252009;
        backdrop-filter: blur(8px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .st {
        text-align: center;
        padding: 17px 11px;
        border-radius: 18px;
      }
      .st b {
        display: block;
        font-size: clamp(1.65rem, 5vw, 2rem);
        line-height: 1.2;
        font-weight: 800;
      }
      .st:nth-child(odd) b {
        color: var(--bl);
      }
      .st:nth-child(even) b {
        color: var(--rd);
      }
      .st small {
        color: var(--mu);
        font-size: 0.81rem;
        line-height: 1.4;
        display: block;
        margin-top: 6px;
      }
      .mon {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 12px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--mu);
      }
      .mon b {
        display: block;
        color: var(--tx);
        font-size: 1.05rem;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .sb {
        fill: var(--bl);
        cursor: pointer;
      }
      .sr {
        fill: var(--rd);
        cursor: pointer;
      }
      .sel {
        stroke: var(--tx);
        stroke-width: 1.4;
        filter: brightness(1.08);
      }
      .ax {
        fill: var(--mu);
        font-size: 7px;
        font-family: "Nunito", sans-serif;
      }
      .tip {
        min-height: 1.6em;
        text-align: center;
        font-weight: 800;
        margin-top: 9px;
        color: var(--rd);
        font-size: 0.91rem;
      }
      .leg {
        display: flex;
        justify-content: center;
        gap: 22px;
        font-size: 0.9rem;
        margin-bottom: 14px;
      }
      .leg i {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .row {
        margin: 13px 0;
      }
      .row .t {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.87rem;
        margin-bottom: 5px;
      }
      .row .t span:nth-child(2) {
        color: var(--mu);
        white-space: nowrap;
      }
      .sp {
        display: flex;
        height: 11px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--bd);
      }
      .sp div {
        height: 100%;
        width: 0;
        transition: width 1.2s;
      }
      .idi {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .idi .card {
        padding: 16px 15px;
        border-left: 4px solid var(--bl);
        border-radius: 17px;
      }
      .idi .card.r {
        border-left-color: var(--rd);
      }
      .idi .card:not(.b):not(.r) {
        border-left-color: #d8a7b3;
      }
      .idi .card.b {
        border-left-color: var(--bl);
      }
      .idi q {
        display: block;
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 1.65rem;
        color: var(--tx);
        quotes: "“" "”";
        line-height: 1.1;
      }
      .idi small {
        color: var(--mu);
        font-size: 0.81rem;
        line-height: 1.4;
        display: block;
        margin-top: 7px;
      }
      .polas {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px 18px;
        margin-top: 20px;
        align-items: start;
      }
      .pola {
        margin: 0;
        position: relative;
        width: 100%;
        background: #fff;
        padding: 9px 9px 8px;
        border-radius: 7px;
        box-shadow: 0 10px 24px #3a20201a;
        transform: rotate(var(--r));
        transition: transform 0.25s;
      }
      .pola:nth-child(2n) {
        margin-top: 18px;
      }
      .pola:hover {
        transform: rotate(0deg) translateY(-3px);
      }
      .pola::before {
        content: "";
        position: absolute;
        top: -8px;
        left: 50%;
        width: 64px;
        height: 18px;
        margin-left: -32px;
        background: var(--c);
        opacity: 0.66;
        transform: rotate(-3deg);
        border-radius: 2px;
      }
      .pola img {
        display: block;
        width: 100%;
        aspect-ratio: 4/5;
        object-fit: cover;
        border-radius: 4px;
      }
      .pola figcaption {
        text-align: center;
        font-family: "Caveat", cursive;
        font-size: 1.32rem;
        line-height: 1.1;
        padding: 9px 2px 3px;
        color: #443338;
      }
      .tl .d {
        text-align: center;
        margin: 25px 0 9px;
        font-size: 0.82rem;
        color: var(--mu);
      }
      .tl .d b {
        color: var(--rd);
        background: var(--rd-soft);
        padding: 4px 12px;
        border-radius: 99px;
      }
      .b {
        max-width: 86%;
        width: max-content;
        padding: 11px 15px;
        border-radius: 18px;
        margin: 8px 0;
        border: 1px solid var(--bd);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.55s, transform 0.55s;
        line-height: 1.5;
        background: var(--card);
        box-shadow: 0 4px 12px #38292d08;
      }
      .b.in {
        opacity: 1;
        transform: none;
      }
      .b.me {
        background: var(--rd-soft);
        border-color: color-mix(in srgb, var(--rd) 24%, var(--bd));
        margin-left: auto;
        border-bottom-right-radius: 6px;
      }
      .b.ow {
        background: var(--bl-soft);
        border-color: color-mix(in srgb, var(--bl) 35%, var(--bd));
        border-bottom-left-radius: 6px;
      }
      .b i {
        display: block;
        font-style: normal;
        font-size: 0.72rem;
        color: var(--mu);
        margin-bottom: 3px;
        font-weight: 800;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 14px;
      }
      .chips span {
        background: var(--bl-soft);
        border: 1px solid color-mix(in srgb, var(--bl) 35%, var(--bd));
        border-radius: 999px;
        padding: 8px 13px;
        font-size: 0.88rem;
        transition: transform 0.2s, color 0.2s;
      }
      .chips span:nth-child(3n) {
        background: var(--rd-soft);
        border-color: color-mix(in srgb, var(--rd) 20%, var(--bd));
      }
      .chips span:active {
        transform: scale(1.05) rotate(-1deg);
      }
      .qz {
        text-align: center;
        padding: 24px 18px;
      }
      .qz .q {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: clamp(1.55rem, 5vw, 2rem);
        line-height: 1.2;
        margin: 12px 0 19px;
      }
      .qz .ch {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .qz .ch button {
        flex: 1;
        max-width: 200px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        color: #fff;
        font-size: 0.98rem;
        font-weight: 800;
        box-shadow: 0 7px 18px #3b191919;
        background: var(--rd);
        transition: transform 0.15s, filter 0.15s;
      }
      button:hover {
        filter: brightness(1.06);
      }
      button:active {
        transform: scale(0.97);
      }
      button.bb {
        background: var(--bl);
        color: #16323d;
      }
      button.rr {
        background: var(--rd);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
      }
      .fb {
        min-height: 2.6em;
        margin-top: 12px;
        font-size: 0.92rem;
      }
      .letter {
        position: relative;
        padding: 27px clamp(18px, 4.5vw, 31px);
        border-radius: 24px;
        background: linear-gradient(
          145deg,
          var(--card),
          color-mix(in srgb, var(--bl-soft) 30%, var(--card))
        );
      }
      .letter::before {
        content: "🍪  👀";
        display: block;
        font-size: 1.05rem;
        letter-spacing: 0.25em;
        margin-bottom: 14px;
      }
      .letter p {
        font-size: 0.99rem;
        line-height: 1.85;
        margin-bottom: 15px;
      }
      .letter .letter-open {
        font-family: "Caveat", cursive;
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--rd);
      }
      .letter .sig {
        font-size: 1.45rem;
        text-align: right;
        margin: 18px 0 0;
        color: var(--rd);
        line-height: 1.2;
      }
      .gr {
        text-align: center;
      }
      .gr .n {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 3rem;
        font-weight: 600;
        color: var(--bl);
        line-height: 1.3;
        margin: 9px 0 12px;
      }
      .gr button {
        background: var(--rd);
      }
      .gift {
        text-align: center;
      }
      .gift h2 {
        justify-content: center;
      }
      .gift .mu {
        max-width: 500px;
        margin: 0 auto 16px;
      }
      #rev {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 1s, opacity 1s;
      }
      #rev.on {
        max-height: 900px;
        opacity: 1;
        margin-top: 23px;
      }
      #rev .hand {
        font-size: 1.32rem;
        line-height: 1.6;
      }
      footer {
        text-align: center;
        color: var(--mu);
        font-size: 0.81rem;
        margin-top: 54px;
        padding: 0 6px;
      }
      @media (max-width: 520px) {
        main {
          padding: 0 16px 58px;
        }
        section {
          padding-top: 35px;
        }
        .card {
          padding: 16px;
        }
        .idi {
          gap: 9px;
        }
        .idi .card {
          padding: 13px 11px;
        }
        .polas {
          gap: 19px 13px;
        }
        .pola figcaption {
          font-size: 1.2rem;
        }
        .b {
          max-width: 92%;
        }
        .leg {
          gap: 14px;
        }
        .qz .ch {
          gap: 8px;
        }
        .qz .ch button {
          padding: 12px 10px;
          font-size: 0.9rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div aria-hidden="true" id="fl"></div>
    <main>
      <section class="hero">
        <div
          aria-label="🍪 👀"
          class="hero-mark"
          style="font-size: 4.2rem; animation: bob 3s ease-in-out infinite"
        >
          🦝 <span>🍪</span><span>👀</span>
        </div>
        <h1>
          <span class="bl">Owen</span> &amp; <span class="rd">Mateo</span>
        </h1>
        <p class="mu">
          De aquel primer «jai» a 18,884 mensajes, pequeñas confidencias y un
          idioma que ya es nuestro. 🍪👀
        </p>
        <div>
          <span class="day">Día <b id="dn">115</b> desde el primer “jai”</span>
        </div>
        <div class="hint">baja, guardé unas cositas aquí ↓</div>
      </section>
      <section>
        <h2>Todo empezó con un «jai»</h2>
        <p>
          El 1 de julio llegó un «jai» y, unos minutos después, ya estábamos
          hablando de Mike, comida, dibujos y cualquier cosa que se cruzara. No
          sabíamos que de ahí iban a salir tantas conversaciones, planes y
          frases que terminarían significando algo para nosotros. Aquí queda un
          pequeño recuento de todo eso. 🍪
        </p>
        <div class="grid" id="stats"></div>
        <div class="card mon" id="mon" style="margin-top: 12px"></div>
      </section>
      <section>
        <h2>Un mensaje lleva a otro</h2>
        <p class="mu">
          Mensajes por día, del 1 de julio al 23 de octubre. Azul: Owen 💙.
          Rojo: Mateo ❤️. Toca una barra para mirar ese día.
        </p>
        <div class="card">
          <svg id="daily" viewbox="0 0 460 150"></svg>
          <div class="tip" id="tip">Toca una barra 👆</div>
        </div>
        <p class="mu" style="margin-top: 12px">
          Solo hubo 7 días sin mensajes en todo el periodo. Y entre el 1 de
          julio y el 9 de septiembre hablamos 71 días seguidos. Al parecer,
          siempre aparecía algo más que contar. 👀
        </p>
      </section>
      <section>
        <h2>Nuestro horario poco razonable</h2>
        <div class="card">
          <svg id="hrs" viewbox="0 0 460 120"></svg>
          <p class="mu" style="text-align: center; margin: 8px 0 0">
            La hora con más mensajes fueron las 7 p. m. (1,729). Después de
            medianoche todavía quedaron 1,091 mensajes. A veces una conversación
            se alarga y ya; no hace falta buscarle una explicación.
          </p>
        </div>
        <div class="card" style="margin-top: 12px">
          <svg id="wk" viewbox="0 0 460 100"></svg>
          <p class="mu" style="text-align: center; margin: 8px 0 0">
            Los miércoles ganan con 4,027 mensajes, seguidos por los domingos.
            Ya tienen su pequeño lugar en este archivo.
          </p>
        </div>
      </section>
      <section>
        <h2>Owen y Mateo, en números</h2>
        <p class="mu">
          Una comparación que nadie pidió, pero que ya está hecha:
        </p>
        <div class="card">
          <div class="leg">
            <span><i style="background: var(--bl)"></i>Owen 🦝</span
            ><span><i style="background: var(--rd)"></i>Mateo</span>
          </div>
          <div id="cmp"></div>
          <p class="mu" style="margin: 14px 0 0">
            Owen suele mandar mensajes cortitos; Mateo se extiende un poquito
            más. El primero en escribir cada día: Mateo 55 días, Owen 53. Casi
            empate. Lo bonito es que casi siempre había algo que contarnos.
          </p>
        </div>
      </section>
      <section>
        <h2>Nuestro pequeño diccionario</h2>
        <p class="mu">
          Hay palabras y formas de escribir que, fuera de contexto, nadie
          entendería. Aquí se quedan algunas de las que ya forman parte de
          nuestras conversaciones. 🍪👀
        </p>
        <div class="idi" id="idi"></div>
      </section>
      <section>
        <h2>Fotos para guardar</h2>
        <div class="polas">
          <figure class="pola" style="--r: 2deg; --c: var(--bl)">
            <img
              alt="Owen y Mateo ☕"
              src="data:image/jpeg;base64,"
              style="object-position: 50% 38%"
            />
            <figcaption class="hand">un recuerdo bonito 🍪</figcaption>
          </figure>
          <figure class="pola" style="--r: -3deg; --c: var(--rd)">
            <img
              alt="foto del dúo"
              src="data:image/jpeg;base64,"
              style="object-position: 50% 30%"
            />
            <figcaption class="hand">nuestras caras de siempre 👀</figcaption>
          </figure>
          <figure class="pola" style="--r: 2deg; --c: var(--pu)">
            <img
              alt="foto de recuerdo"
              src="data:image/jpeg;base64,"
              style="object-position: 50% 45%"
            />
            <figcaption class="hand">un momento para volver</figcaption>
          </figure>
          <figure class="pola" style="--r: -2deg; --c: var(--bl)">
            <img
              alt="Owen 🦝"
              src="data:image/jpeg;base64,"
