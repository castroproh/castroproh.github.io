      <section>
        <h2>Cosas que me has contado</h2>
        <p class="mu">
          El 8 de julio te pregunté qué te gustaba y me compartiste una lista
          larguísima. Me acuerdo de varias; las dejo aquí porque me gusta
          conocer esas partes tuyas.
